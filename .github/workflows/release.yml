name: Release AAB

# Подписанный AAB по тегу вида v1.2.3. Ключ подписи — из секретов репозитория:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parts-trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты перед релизом
        run: ./gradlew :core:test :app:testDebugUnitTest
      - name: Восстановить keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Секрет KEYSTORE_BASE64 не задан"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Собрать подписанный AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:bundleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: parts-trainer/app/build/outputs/bundle/release/*.aab
      - name: Приложить к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: parts-trainer/app/build/outputs/bundle/release/*.aab
